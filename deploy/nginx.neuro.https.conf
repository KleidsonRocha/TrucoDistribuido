# Instale somente depois de emitir o certificado deste subdomínio.
map $http_upgrade $neuro_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name neuro.clayforgestudio.com.br;
    return 301 https://neuro.clayforgestudio.com.br$request_uri;
}
server {
    listen 443 ssl;
    server_name neuro.clayforgestudio.com.br;
    ssl_certificate /etc/letsencrypt/live/neuro.clayforgestudio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuro.clayforgestudio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        # Preserve também a porta: o gateway confere Host contra Origin no WS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neuro_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
