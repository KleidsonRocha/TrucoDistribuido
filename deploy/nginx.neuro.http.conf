# Bootstrap HTTP: use antes de emitir o certificado do novo subdomínio.
map $http_upgrade $neuro_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name neuro.clayforgestudio.com.br;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neuro_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
